<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISO/IEC 42001 Audio Learning Lab</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=0.9-all-friendly-visual">
</head>
<body>
  <div id="progress"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo-wrap">
        <img class="brand-logo" src="assets/applus-certification-logo-transparent.png" alt="Applus+ certification">
      </span>
      <span class="brand-line"></span>
      <span class="brand-sub">ISO/IEC 42001 AI Management System Academy</span>
    </div>
    <nav class="toolbar" aria-label="Course controls">
      <button id="mapBtn" type="button" title="Course map">Map</button>
      <button id="notesBtn" type="button" title="Narration script">Script</button>
      <select id="voiceSelect" title="Narration voice">
        <option value="en" selected>English Neural</option>
      </select>
      <button id="audioModeBtn" type="button" title="Audio mode">Auto: On</button>
      <button id="fullscreenBtn" type="button" title="Fullscreen">Full</button>
    </nav>
  </header>

  <main id="stage" aria-live="polite"></main>

  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong id="drawerTitle">Script</strong>
      <button id="drawerClose" type="button" aria-label="Close">x</button>
    </div>
    <div id="drawerBody"></div>
  </aside>

  <footer class="player">
    <div class="slide-counter">
      <button id="prevBtn" type="button" aria-label="Previous slide">&lt;</button>
      <span id="counterText">1 / 1</span>
      <button id="nextBtn" type="button" aria-label="Next slide">&gt;</button>
    </div>
    <div class="audio-panel">
      <button id="playBtn" type="button" aria-label="Play or pause">Play</button>
      <div class="audio-meta">
        <div id="audioTitle">Audio loading</div>
        <div class="audio-time"><span id="audioNow">00:00</span><span id="audioDuration">00:00</span></div>
        <input id="seek" type="range" min="0" max="100" value="0" aria-label="Audio progress">
      </div>
      <select id="rateSelect" aria-label="Playback speed">
        <option value="0.8">0.8x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>
      <audio id="audio"></audio>
    </div>
  </footer>

  <script src="data/course_data_embedded.js?v=0.9-all-friendly-visual"></script>
  <script src="app.js?v=0.9-all-friendly-visual"></script>
</body>
</html>
